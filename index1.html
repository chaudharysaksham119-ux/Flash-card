<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nevermore — Projects</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Nevermore</h1>
    <p class="sub">Choose a project to open</p>
  </header>

  <main>
    <div id="grid" class="grid">Loading…</div>
  </main>

  <footer>
    <span id="count"></span>
  </footer>

  <script>
    async function loadProjects() {
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('projects.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('projects.json not found');
        const projects = await res.json();

        if (!projects.length) {
          grid.innerHTML = '<p class="empty">No projects yet.</p>';
          return;
        }

        grid.innerHTML = projects.map(p => `
          <a class="card" href="${p.url}" target="${p.external ? '_blank' : '_self'}" rel="noopener">
            <h3>${p.title}</h3>
            <p>${p.description || ''}</p>
            <div class="tags">
              ${(p.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
          </a>
        `).join('');

        document.getElementById('count').textContent = `${projects.length} project(s)`;
      } catch (err) {
        grid.innerHTML = `<p class="empty">Failed to load projects: ${err.message}</p>`;
      }
    }
    loadProjects();
  </script>
</body>
</html>
